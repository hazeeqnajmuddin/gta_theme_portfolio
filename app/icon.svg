<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Carbon Shield Background -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c24" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    
    <!-- Metallic GTA V Gold Gradient (Darker Side) -->
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff199" />
      <stop offset="30%" stop-color="#fabb15" />
      <stop offset="70%" stop-color="#cf9400" />
      <stop offset="100%" stop-color="#7a5500" />
    </linearGradient>

    <!-- Accent Bright Gold Gradient (Lighter Side) -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffe266" />
      <stop offset="100%" stop-color="#fabb15" />
    </linearGradient>

    <!-- Glowing Drop Shadow -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#fabb15" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Dark Shield Container -->
  <path d="M 256,32 L 440,96 L 440,288 C 440,392 344,464 256,480 C 168,464 72,392 72,288 L 72,96 Z" fill="url(#shieldBg)" stroke="url(#goldMetal)" stroke-width="16" stroke-linejoin="round" />

  <!-- Inner Shield Accent Line -->
  <path d="M 256,60 L 416,116 L 416,276 C 416,364 332,430 256,446 C 180,430 96,364 96,276 L 96,116 Z" fill="none" stroke="#fabb15" stroke-width="4" opacity="0.4" />

  <!-- Sharp Metallic GTA 'H' Emblem Centerpiece -->
  <g filter="url(#badgeGlow)">
    <!-- Left Pillar of 'H' -->
    <polygon points="140,140 195,140 195,380 140,380" fill="url(#goldMetal)" />
    
    <!-- Right Pillar of 'H' -->
    <polygon points="317,140 372,140 372,380 317,380" fill="url(#goldLight)" />

    <!-- Crossbar of 'H' (Split for 3D Facet Effect) -->
    <polygon points="195,230 256,230 256,290 195,290" fill="url(#goldMetal)" />
    <polygon points="256,230 317,230 317,290 256,290" fill="url(#goldLight)" />

    <!-- GTA V Style Roman Numeral Etchings on Right Pillar -->
    <polygon points="330,165 342,165 334,355 322,355" fill="#0d1017" opacity="0.5" />
    <polygon points="350,165 362,165 354,355 342,355" fill="#0d1017" opacity="0.5" />
  </g>
</svg>
