<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Metallic Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820" />
      <stop offset="100%" stop-color="#080a0e" />
    </linearGradient>
    
    <!-- Premium GTA V Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffea85" />
      <stop offset="45%" stop-color="#fabb15" />
      <stop offset="100%" stop-color="#b88300" />
    </linearGradient>

    <!-- Subtle Drop Shadow Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#fabb15" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Dark Container with Gold GTA Border -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="20" />
  
  <!-- GTA V Style Top & Bottom Accent Bars -->
  <rect x="95" y="110" width="322" height="10" fill="#fabb15" rx="4" opacity="0.9" />
  <rect x="95" y="392" width="322" height="10" fill="#fabb15" rx="4" opacity="0.9" />

  <!-- Bold GTA V 'HN' Monogram Emblem -->
  <g filter="url(#glow)">
    <!-- Letter 'H' -->
    <path d="M 95,140 L 145,140 L 145,230 L 195,230 L 195,140 L 245,140 L 245,372 L 195,372 L 195,275 L 145,275 L 145,372 L 95,372 Z" fill="url(#goldGrad)" />
    
    <!-- Letter 'N' -->
    <path d="M 267,140 L 315,140 L 369,285 L 369,140 L 417,140 L 417,372 L 369,372 L 315,227 L 315,372 L 267,372 Z" fill="url(#goldGrad)" />
  </g>
</svg>
